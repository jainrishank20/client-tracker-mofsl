name: Sync GSheet Only

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread gspread-formatting google-auth google-auth-oauthlib yfinance

      - name: Reconstruct credentials
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
          GSHEET_KEY: ${{ secrets.GSHEET_KEY }}
        run: |
          printf '%s' "$BOT_CONFIG" > bot_config.json
          printf '%s' "$GSHEET_KEY" > gsheet_key.json
          # ticker_overrides.json comes from git checkout — authoritative source

      - name: Pull trades.json + ledger.json from VM
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          $SCP opc@${{ secrets.VM_HOST }}:/home/opc/app/trades.json . && echo "trades.json: from VM" || echo "VM unreachable — will use repo trades.json"
          $SCP opc@${{ secrets.VM_HOST }}:/home/opc/app/ledger.json . || true
          rm -f /tmp/vm_key
          if [ ! -f trades.json ]; then echo "ERROR: No trades.json from VM or repo — cannot sync"; exit 1; fi
          echo "trades.json: $(wc -l < trades.json) lines"

      - name: Sync Google Sheet
        run: python vm_sync_gsheet.py

      - name: Cleanup
        if: always()
        run: rm -f bot_config.json gsheet_key.json
