name: Setup VM Downloader

# One-time setup: install Playwright on Oracle VM and configure cron.
# Safe to re-run — idempotent.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          trap 'rm -f /tmp/vm_key' EXIT

          VM="opc@${{ secrets.VM_HOST }}"
          OPTS="-i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=20 -o ServerAliveCountMax=10"

          echo "=== Waiting for SSH ==="
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt..."
            ssh $OPTS "$VM" "echo connected" && break
            [ $attempt -lt 5 ] && sleep 30 || { echo "VM unreachable after 5 attempts"; exit 1; }
          done

          echo "=== Copying scripts to VM ==="
          scp $OPTS vm_daily_run.sh vm_setup.sh ticker_overrides.json symbol_map.py "$VM:/home/opc/app/"

          echo "=== Running setup on VM ==="
          ssh $OPTS "$VM" "chmod +x /home/opc/app/vm_setup.sh && /home/opc/app/vm_setup.sh"
