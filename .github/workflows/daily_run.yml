name: Daily Trade Download

on:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Download both FY 2025-26 and 2026-27'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_download:
        description: 'Skip CBOS download (VM already pushed trades.json + ledger.json)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    - cron: '0 14 * * 1-6'   # Mon-Sat 7:30 PM IST (14:00 UTC) — incremental
    - cron: '30 5 * * 0'     # Sun   11:00 AM IST (05:30 UTC)  — full history

concurrency:
  group: daily-run
  cancel-in-progress: false   # never cancel a running pipeline; queue instead

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write   # needed for git push in "Commit data files to repo" step

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright pandas gspread gspread-formatting google-auth google-auth-oauthlib groq yfinance PyNaCl

      - name: Install Playwright Chromium + system deps
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Reconstruct credentials
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
          GSHEET_KEY: ${{ secrets.GSHEET_KEY }}
        run: |
          printf '%s' "$BOT_CONFIG" > bot_config.json
          printf '%s' "$GSHEET_KEY" > gsheet_key.json
          mkdir -p mo_csvs
          # ticker_overrides.json comes from git checkout — no secret needed

      - name: Get cache keys
        id: cachekeys
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          echo "today=$(date +%Y-%m-%d)"   >> $GITHUB_OUTPUT
          echo "month=$(date +%Y-%m)"      >> $GITHUB_OUTPUT

      # ── Restore CSVs + ledger from cache (only when doing a GHA download) ─────
      # ledger.json also cached so CBOS outages don't blank the ledger column.
      - name: Restore CSVs from cache
        if: ${{ github.event.inputs.skip_download != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            mo_csvs
            ledger.json
          key: csvs-${{ steps.cachekeys.outputs.today }}
          restore-keys: |
            csvs-
            fy2526-csvs-

      # ── Step 1: Download CSVs + ledger from CBOS (GHA runner only) ───────────
      # Skipped when VM already ran (skip_download=true) — trades.json from checkout.
      # On GHA: full download when full_history=true, incremental otherwise.
      - name: Download CSVs from CBOS (Playwright headless)
        if: ${{ github.event.inputs.skip_download != 'true' }}
        continue-on-error: true
        run: |
          IS_MANUAL_FULL="${{ github.event.inputs.full_history == 'true' }}"
          IS_SUNDAY_CRON="${{ github.event.schedule == '30 5 * * 0' }}"
          if [ "$IS_MANUAL_FULL" = "true" ] || [ "$IS_SUNDAY_CRON" = "true" ]; then
            echo "Running FULL history download..."
            python mo_downloader.py --full
          else
            python mo_downloader.py
          fi
        timeout-minutes: 40

      # ── Save all CSVs + ledger to cache after GHA download ───────────────────
      - name: Save CSVs to cache
        if: ${{ github.event.inputs.skip_download != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            mo_csvs
            ledger.json
          key: csvs-${{ steps.cachekeys.outputs.today }}

      # ── Step 2: Rebuild trades.json (only when GHA downloaded CSVs) ──────────
      # When skip_download=true, trades.json is already in the checkout (from VM push).
      - name: Import all CSVs → trades.json
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: python import_all.py

      # ── Step 2b: QA gate ─────────────────────────────────────────────────────
      - name: QA — validate trade counts
        continue-on-error: true
        run: python tests/test_import_counts.py

      # ── Step 2c: QA — stale MTF + open position delta ────────────────────────
      - name: QA — stale MTF positions + open position delta
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_qa
          chmod 600 /tmp/vm_key_qa
          scp -i /tmp/vm_key_qa -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            opc@152.67.164.204:/home/opc/client-tracker-mofsl/open_positions_snapshot.json . 2>/dev/null || true
          rm -f /tmp/vm_key_qa
          python tests/qa_positions.py

      # ── Step 3: Sync Google Sheet ─────────────────────────────────────────────
      - name: Sync Google Sheet
        continue-on-error: true
        run: python vm_sync_gsheet.py

      # ── Step 3b: Fetch P&L snapshot from VM ──────────────────────────────────
      - name: Fetch P&L snapshot from VM
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_snap
          chmod 600 /tmp/vm_key_snap
          scp -i /tmp/vm_key_snap -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            opc@152.67.164.204:/home/opc/client-tracker-mofsl/pnl_snapshot.json pnl_snapshot.json 2>/dev/null || true
          rm -f /tmp/vm_key_snap

      # ── Step 4: Send Telegram ledger summary ──────────────────────────────────
      - name: Send Telegram notification
        run: python send_notify.py

      # ── Step 4b: Sync clients list to VM bot_config ───────────────────────────
      - name: Sync clients to VM bot_config
        if: always()
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_cfg
          chmod 600 /tmp/vm_key_cfg
          python3 -c "
          import json, os
          raw = os.environ['BOT_CONFIG'].lstrip('﻿')
          cfg = json.loads(raw)
          patch = {'clients': cfg.get('clients', {}), 'github_token': cfg.get('github_token', '')}
          print(json.dumps(patch))
          " > /tmp/new_clients.json
          SSH="ssh -i /tmp/vm_key_cfg -o StrictHostKeyChecking=no -o ConnectTimeout=30 opc@152.67.164.204"
          $SSH "python3 -c \"
          import json
          path='/home/opc/client-tracker-mofsl/bot_config.json'
          c=json.load(open(path))
          patch=json.load(open('/dev/stdin'))
          c['clients']=patch['clients']
          if patch.get('github_token'): c['github_token']=patch['github_token']
          json.dump(c,open(path,'w'),indent=2)
          print('Synced clients:', list(patch['clients'].keys()))
          \"" < /tmp/new_clients.json
          rm -f /tmp/vm_key_cfg /tmp/new_clients.json

      # ── Step 5: Push trades.json + ledger.json to VM ─────────────────────────
      - name: Push data files to VM
        if: always()
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          trap 'rm -f /tmp/vm_key /tmp/vm_overrides.json' EXIT
          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"
          $SCP "$VM:$VMDIR/ticker_overrides.json" /tmp/vm_overrides.json 2>/dev/null || true
          python3 -c "import json,sys; json.loads(open('/tmp/vm_overrides.json',encoding='utf-8-sig').read())" 2>/dev/null || echo '{}' > /tmp/vm_overrides.json
          python3 -c "import json,os; r=json.loads(open('ticker_overrides.json',encoding='utf-8-sig').read()) if os.path.exists('ticker_overrides.json') else {}; v=json.loads(open('/tmp/vm_overrides.json',encoding='utf-8-sig').read()) if os.path.exists('/tmp/vm_overrides.json') else {}; m={**r,**v}; json.dump(m,open('ticker_overrides.json','w'),indent=2); print(f'Merged overrides: {len(r)} runner + {len(v)} VM = {len(m)} total')"
          $SCP trades.json ledger.json symbol_map.py ticker_overrides.json "$VM:$VMDIR/"
          [ -f pnl_snapshot.json ]           && $SCP pnl_snapshot.json           "$VM:$VMDIR/" || true
          [ -f open_positions_snapshot.json ] && $SCP open_positions_snapshot.json "$VM:$VMDIR/" || true

      # ── Step 5b: Commit data files to repo ───────────────────────────────────
      - name: Commit data files to repo
        if: always()
        continue-on-error: true
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add trades.json ledger.json open_positions_snapshot.json ticker_overrides.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update data files + auto-resolved tickers [skip ci]"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git push

      # ── Step 6: Pipeline health alert ────────────────────────────────────────
      - name: Send pipeline health alert
        if: always()
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          printf '%s' "$BOT_CONFIG" > bot_config.json
          IS_FULL="false"
          [ "${{ github.event.inputs.full_history }}" = "true" ] && IS_FULL="true"
          [ "${{ github.event.schedule }}" = "30 5 * * 0" ] && IS_FULL="true"
          python tests/send_health_alert.py \
            --status "${{ job.status }}" \
            --full "$IS_FULL"

      - name: Cleanup credentials
        if: always()
        run: rm -f bot_config.json gsheet_key.json
