name: Daily Trade Download

on:
  schedule:
    # 3:00 PM UTC = 8:30 PM IST, Mon-Fri — daily incremental
    - cron: '0 15 * * 1-5'
    # 2:00 AM UTC = 7:30 AM IST, Sunday — weekly full re-download to fix any ghost positions
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Download both FY 2025-26 and 2026-27 (use for initial setup or missing history)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: daily-run
  cancel-in-progress: false   # never cancel a running pipeline; queue instead

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright pandas gspread gspread-formatting google-auth google-auth-oauthlib groq yfinance PyNaCl

      - name: Install Playwright Chromium + system deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Reconstruct credentials
        env:
          BOT_CONFIG:       ${{ secrets.BOT_CONFIG }}
          GSHEET_KEY:       ${{ secrets.GSHEET_KEY }}
          TICKER_OVERRIDES: ${{ secrets.TICKER_OVERRIDES }}
        run: |
          echo "$BOT_CONFIG"       > bot_config.json
          echo "$GSHEET_KEY"       > gsheet_key.json
          echo "$TICKER_OVERRIDES" > ticker_overrides.json
          mkdir -p mo_csvs

      # ── Restore FY25-26 CSVs from cache (populated by a --full run) ──────────
      # FY25-26 is a closed year — data never changes, safe to cache indefinitely.
      # Daily run downloads FY26-27 fresh; this ensures import sees BOTH years
      # so P&L reflects full history, not just the current year.
      - name: Restore FY25-26 CSVs from cache
        uses: actions/cache/restore@v4
        with:
          path: mo_csvs
          key: fy2526-csvs-v1
          restore-keys: fy2526-csvs-v1

      # ── Step 1: Download CSVs + ledger from CBOS ────────────────────────────
      # Full history runs on: Sunday auto-schedule OR manual trigger with full_history=true
      - name: Download CSVs from CBOS (Playwright headless)
        run: |
          IS_SUNDAY_RUN="${{ github.event.schedule == '0 2 * * 0' }}"
          IS_MANUAL_FULL="${{ github.event.inputs.full_history == 'true' }}"
          if [ "$IS_SUNDAY_RUN" = "true" ] || [ "$IS_MANUAL_FULL" = "true" ]; then
            echo "Running FULL history download..."
            python mo_downloader.py --full
          else
            python mo_downloader.py
          fi
        timeout-minutes: 20

      # ── Cache FY25-26 CSVs after a full run so daily runs can reuse them ────
      - name: Save FY25-26 CSVs to cache
        if: github.event.inputs.full_history == 'true' || github.event.schedule == '0 2 * * 0'
        uses: actions/cache/save@v4
        with:
          path: mo_csvs
          key: fy2526-csvs-v1

      # ── Step 2: Rebuild trades.json ─────────────────────────────────────────
      - name: Import all CSVs → trades.json
        run: python import_all.py

      # ── Step 2b: QA gate — fail fast if per-client counts look wrong ─────────
      - name: QA — validate trade counts
        run: python tests/test_import_counts.py

      # ── Step 3: Sync Google Sheet ────────────────────────────────────────────
      - name: Sync Google Sheet
        run: python vm_sync_gsheet.py

      # ── Step 4: Send Telegram ledger summary ────────────────────────────────
      - name: Send Telegram notification
        run: python send_notify.py

      # ── Step 5: Push trades.json + ledger.json to VM (bot reads these) ──────
      - name: Push data files to VM
        continue-on-error: true   # VM unreachable = skip, don't fail whole run
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          trap 'rm -f /tmp/vm_key /tmp/vm_overrides.json' EXIT
          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no"
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"
          # Merge VM's ticker_overrides (has /addticker entries) with runner's (has secret entries)
          # VM entries take priority so manual fixes are never lost
          $SCP "$VM:$VMDIR/ticker_overrides.json" /tmp/vm_overrides.json 2>/dev/null || echo '{}' > /tmp/vm_overrides.json
          python3 -c "
import json, os
try:
    v = json.load(open('/tmp/vm_overrides.json')) if os.path.exists('/tmp/vm_overrides.json') else {}
except Exception as e:
    print(f'Warning: VM ticker_overrides unreadable ({e}), using empty dict')
    v = {}
r = json.load(open('ticker_overrides.json')) if os.path.exists('ticker_overrides.json') else {}
m = {**r, **v}
json.dump(m, open('ticker_overrides.json', 'w'), indent=2)
print(f'Merged overrides: {len(r)} runner + {len(v)} VM = {len(m)} total')
"
          $SCP trades.json ledger.json symbol_map.py ticker_overrides.json "$VM:$VMDIR/"

      # ── Step 6: Pipeline health alert ────────────────────────────────────────
      - name: Send pipeline health alert
        if: always()
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          echo "$BOT_CONFIG" > bot_config.json
          IS_FULL="false"
          [ "${{ github.event.inputs.full_history }}" = "true" ] && IS_FULL="true"
          [ "${{ github.event.schedule }}" = "0 2 * * 0" ] && IS_FULL="true"
          python tests/send_health_alert.py \
            --status "${{ job.status }}" \
            --full "$IS_FULL"

      - name: Cleanup credentials
        if: always()
        run: rm -f bot_config.json gsheet_key.json ticker_overrides.json
