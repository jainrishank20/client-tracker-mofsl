name: Daily Trade Download

on:
  schedule:
    # 3:00 PM UTC = 8:30 PM IST, Mon-Fri
    - cron: '0 15 * * 1-5'
  workflow_dispatch:  # manual trigger from GitHub Actions tab

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright pandas gspread gspread-formatting google-auth google-auth-oauthlib groq yfinance

      - name: Install Playwright Chromium + system deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Reconstruct credentials
        env:
          BOT_CONFIG:       ${{ secrets.BOT_CONFIG }}
          GSHEET_KEY:       ${{ secrets.GSHEET_KEY }}
          TICKER_OVERRIDES: ${{ secrets.TICKER_OVERRIDES }}
        run: |
          echo "$BOT_CONFIG"       > bot_config.json
          echo "$GSHEET_KEY"       > gsheet_key.json
          echo "$TICKER_OVERRIDES" > ticker_overrides.json
          mkdir -p mo_csvs

      # ── Step 1: Download CSVs + ledger from CBOS ────────────────────────────
      - name: Download CSVs from CBOS (Playwright headless)
        run: python mo_downloader.py
        timeout-minutes: 20

      # ── Step 2: Rebuild trades.json ─────────────────────────────────────────
      - name: Import all CSVs → trades.json
        run: python import_all.py

      # ── Step 3: Sync Google Sheet ────────────────────────────────────────────
      - name: Sync Google Sheet
        run: python vm_sync_gsheet.py

      # ── Step 4: Send Telegram ledger summary ────────────────────────────────
      - name: Send Telegram notification
        run: python send_notify.py

      # ── Step 5: Push trades.json + ledger.json to VM (bot reads these) ──────
      - name: Push data files to VM
        continue-on-error: true   # VM unreachable = skip, don't fail whole run
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no"
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"
          $SCP trades.json ledger.json "$VM:$VMDIR/"
          rm /tmp/vm_key

      - name: Cleanup credentials
        if: always()
        run: rm -f bot_config.json gsheet_key.json
