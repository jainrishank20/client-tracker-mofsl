name: Daily Trade Download

on:
  schedule:
    # 3:00 PM UTC = 8:30 PM IST, Mon-Fri — daily incremental
    - cron: '0 15 * * 1-5'
    # 6:30 AM UTC = 12:00 PM IST, Sunday — weekly full re-download (noon avoids CBOS morning maintenance)
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Download both FY 2025-26 and 2026-27 (use for initial setup or missing history)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: daily-run
  cancel-in-progress: false   # never cancel a running pipeline; queue instead

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed for git push in "Commit data files to repo" step

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright pandas gspread gspread-formatting google-auth google-auth-oauthlib groq yfinance PyNaCl

      - name: Install Playwright Chromium + system deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Reconstruct credentials
        env:
          BOT_CONFIG:       ${{ secrets.BOT_CONFIG }}
          GSHEET_KEY:       ${{ secrets.GSHEET_KEY }}
          TICKER_OVERRIDES: ${{ secrets.TICKER_OVERRIDES }}
        run: |
          printf '%s' "$BOT_CONFIG"       > bot_config.json
          printf '%s' "$GSHEET_KEY"       > gsheet_key.json
          printf '%s' "$TICKER_OVERRIDES" > ticker_overrides.json
          mkdir -p mo_csvs

      # ── Rotate cache key monthly so stale/incomplete FY25-26 CSVs don't persist ──
      # Key format: fy2526-csvs-YYYY-MM — auto-invalidates on month rollover.
      # First Sunday of each new month triggers a full re-download.
      - name: Get cache month key
        id: month
        run: echo "ym=$(date +%Y-%m)" >> $GITHUB_OUTPUT

      # ── Restore FY25-26 CSVs from cache (populated by a --full run) ──────────
      # FY25-26 is a closed year — data never changes, safe to cache indefinitely.
      # Daily run downloads FY26-27 fresh; this ensures import sees BOTH years
      # so P&L reflects full history, not just the current year.
      - name: Restore FY25-26 CSVs from cache
        uses: actions/cache/restore@v4
        with:
          path: mo_csvs
          key: fy2526-csvs-${{ steps.month.outputs.ym }}
          restore-keys: fy2526-csvs-

      # ── Step 1: Download CSVs + ledger from CBOS ────────────────────────────
      # Full history runs on: Sunday auto-schedule OR manual trigger with full_history=true
      - name: Download CSVs from CBOS (Playwright headless)
        continue-on-error: true   # partial downloads still feed import; don't skip it on CBOS slowness
        run: |
          IS_SUNDAY_RUN="${{ github.event.schedule == '0 2 * * 0' }}"
          IS_MANUAL_FULL="${{ github.event.inputs.full_history == 'true' }}"
          if [ "$IS_SUNDAY_RUN" = "true" ] || [ "$IS_MANUAL_FULL" = "true" ]; then
            echo "Running FULL history download..."
            python mo_downloader.py --full
          else
            python mo_downloader.py
          fi
        timeout-minutes: 35

      # ── Cache FY25-26 CSVs after a full run so daily runs can reuse them ────
      - name: Save FY25-26 CSVs to cache
        if: github.event.inputs.full_history == 'true' || github.event.schedule == '0 2 * * 0'
        uses: actions/cache/save@v4
        with:
          path: mo_csvs
          key: fy2526-csvs-${{ steps.month.outputs.ym }}

      # ── Step 2: Rebuild trades.json ─────────────────────────────────────────
      - name: Import all CSVs → trades.json
        run: python import_all.py

      # ── Step 2b: QA gate — warns on bad data but never blocks VM sync/push ─────
      - name: QA — validate trade counts
        continue-on-error: true
        run: python tests/test_import_counts.py

      # ── Step 2c: QA — stale MTF + open position delta ────────────────────────
      - name: QA — stale MTF positions + open position delta
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_qa
          chmod 600 /tmp/vm_key_qa
          scp -i /tmp/vm_key_qa -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            opc@152.67.164.204:/home/opc/client-tracker-mofsl/open_positions_snapshot.json . 2>/dev/null || true
          rm -f /tmp/vm_key_qa
          python tests/qa_positions.py

      # ── Step 3: Sync Google Sheet ────────────────────────────────────────────
      - name: Sync Google Sheet
        continue-on-error: true   # GSheet rate limit / yfinance timeout must not block Telegram notify
        run: python vm_sync_gsheet.py

      # ── Step 3b: Fetch yesterday's P&L snapshot from VM (for movement delta) ──
      - name: Fetch P&L snapshot from VM
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_snap
          chmod 600 /tmp/vm_key_snap
          scp -i /tmp/vm_key_snap -o StrictHostKeyChecking=no -o ConnectTimeout=30 opc@152.67.164.204:/home/opc/client-tracker-mofsl/pnl_snapshot.json pnl_snapshot.json 2>/dev/null || true
          rm -f /tmp/vm_key_snap

      # ── Step 4: Send Telegram ledger summary ────────────────────────────────
      - name: Send Telegram notification
        run: python send_notify.py

      # ── Step 4b: Sync clients list from secret into VM's bot_config.json ────
      - name: Sync clients to VM bot_config
        if: always()
        continue-on-error: true
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key_cfg
          chmod 600 /tmp/vm_key_cfg
          python3 -c "
          import json, os
          raw = os.environ['BOT_CONFIG'].lstrip('﻿')
          cfg = json.loads(raw)
          patch = {'clients': cfg.get('clients', {}), 'github_token': cfg.get('github_token', '')}
          print(json.dumps(patch))
          " > /tmp/new_clients.json
          SSH="ssh -i /tmp/vm_key_cfg -o StrictHostKeyChecking=no -o ConnectTimeout=30 opc@152.67.164.204"
          $SSH "python3 -c \"
          import json
          path='/home/opc/client-tracker-mofsl/bot_config.json'
          c=json.load(open(path))
          patch=json.load(open('/dev/stdin'))
          c['clients']=patch['clients']
          if patch.get('github_token'): c['github_token']=patch['github_token']
          json.dump(c,open(path,'w'),indent=2)
          print('Synced clients:', list(patch['clients'].keys()))
          print('github_token updated:', bool(patch.get('github_token')))
          \"" < /tmp/new_clients.json
          rm -f /tmp/vm_key_cfg /tmp/new_clients.json

      # ── Step 5: Push trades.json + ledger.json to VM (bot reads these) ──────
      - name: Push data files to VM
        if: always()
        continue-on-error: true   # VM unreachable = skip, don't fail whole run
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          trap 'rm -f /tmp/vm_key /tmp/vm_overrides.json' EXIT
          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"
          # Merge VM's ticker_overrides (has /addticker entries) with runner's (has secret entries)
          # VM entries take priority so manual fixes are never lost
          $SCP "$VM:$VMDIR/ticker_overrides.json" /tmp/vm_overrides.json 2>/dev/null || true
          python3 -c "import json,sys; json.loads(open('/tmp/vm_overrides.json',encoding='utf-8-sig').read())" 2>/dev/null || echo '{}' > /tmp/vm_overrides.json
          python3 -c "import json,os; r=json.loads(open('ticker_overrides.json',encoding='utf-8-sig').read()) if os.path.exists('ticker_overrides.json') else {}; v=json.loads(open('/tmp/vm_overrides.json',encoding='utf-8-sig').read()) if os.path.exists('/tmp/vm_overrides.json') else {}; m={**r,**v}; json.dump(m,open('ticker_overrides.json','w'),indent=2); print(f'Merged overrides: {len(r)} runner + {len(v)} VM = {len(m)} total')"
          $SCP trades.json ledger.json symbol_map.py ticker_overrides.json "$VM:$VMDIR/"
          [ -f pnl_snapshot.json ]           && $SCP pnl_snapshot.json           "$VM:$VMDIR/" || true
          [ -f open_positions_snapshot.json ] && $SCP open_positions_snapshot.json "$VM:$VMDIR/" || true

      # ── Step 5b: Commit trades.json + ledger.json to repo (sync_sheet fallback) ─
      - name: Commit data files to repo
        if: always()
        continue-on-error: true
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add trades.json ledger.json open_positions_snapshot.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update trades.json + ledger.json [skip ci]"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git push

      # ── Step 6: Pipeline health alert ────────────────────────────────────────
      - name: Send pipeline health alert
        if: always()
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          printf '%s' "$BOT_CONFIG" > bot_config.json
          IS_FULL="false"
          [ "${{ github.event.inputs.full_history }}" = "true" ] && IS_FULL="true"
          [ "${{ github.event.schedule }}" = "0 2 * * 0" ] && IS_FULL="true"
          python tests/send_health_alert.py \
            --status "${{ job.status }}" \
            --full "$IS_FULL"

      - name: Cleanup credentials
        if: always()
        run: rm -f bot_config.json gsheet_key.json ticker_overrides.json
