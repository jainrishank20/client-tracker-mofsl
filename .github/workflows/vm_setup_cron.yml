name: VM Setup — Install GitHub Pull Cron

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Write SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key

      - name: Try SSH with retries (VM can be slow to accept)
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=10 opc@152.67.164.204"

          for attempt in 1 2 3 4 5; do
            echo "=== SSH attempt $attempt ==="
            $SSH "echo connected" && break
            echo "Attempt $attempt failed, waiting 30s..."
            sleep 30
          done

      - name: Install pull script on VM
        run: |
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=10 opc@152.67.164.204"

          $SSH bash << 'REMOTE'
          set -e
          DIR="/home/opc/client-tracker-mofsl"
          REPO="https://raw.githubusercontent.com/jainrishank20/client-tracker-mofsl/main"

          # Write the pull script
          cat > "$DIR/pull_from_github.sh" << 'EOF'
          #!/bin/bash
          REPO="https://raw.githubusercontent.com/jainrishank20/client-tracker-mofsl/main"
          DIR="/home/opc/client-tracker-mofsl"

          curl -sf "$REPO/trades.json"           > "$DIR/trades.json.tmp"           && mv "$DIR/trades.json.tmp"           "$DIR/trades.json"           && echo "trades.json updated"
          curl -sf "$REPO/ticker_overrides.json" > "$DIR/ticker_overrides.json.tmp" && mv "$DIR/ticker_overrides.json.tmp" "$DIR/ticker_overrides.json" && echo "ticker_overrides.json updated"
          curl -sf "$REPO/ledger.json"           > "$DIR/ledger.json.tmp"           && mv "$DIR/ledger.json.tmp"           "$DIR/ledger.json"           && echo "ledger.json updated"
          echo "$(date): pull done" >> /tmp/github_pull.log
          EOF

          chmod +x "$DIR/pull_from_github.sh"

          # Install cron: every 30 minutes
          ( crontab -l 2>/dev/null | grep -v pull_from_github ; echo "*/30 * * * * /home/opc/client-tracker-mofsl/pull_from_github.sh >> /tmp/github_pull.log 2>&1" ) | crontab -

          echo "=== Cron installed ==="
          crontab -l

          # Run it once immediately to verify
          bash "$DIR/pull_from_github.sh"
          echo "=== First pull done ==="
          ls -la "$DIR/trades.json" "$DIR/ticker_overrides.json" "$DIR/ledger.json"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f /tmp/vm_key
