name: Stale Data Alert

on:
  schedule:
    - cron: '45 15 * * 0-6'   # 9:15 PM IST every day (Sun: 10h after VM run; Mon-Sat: 45m after daily_run)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for successful daily run today
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          echo "Checking for a successful daily_run on $today..."
          successful=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/daily_run.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at >= \"${today}T00:00:00Z\") | select(.conclusion == \"success\")] | length")
          echo "Successful runs today: $successful"
          echo "NEED_ALERT=$( [ "$successful" = "0" ] && echo true || echo false )" >> $GITHUB_ENV

      - name: Send stale-data Telegram alert
        if: env.NEED_ALERT == 'true'
        env:
          BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
        run: |
          printf '%s' "$BOT_CONFIG" > bot_config.json
          python tests/stale_alert.py
          rm -f bot_config.json

      - name: All good
        if: env.NEED_ALERT == 'false'
        run: echo "Daily run succeeded today — no alert needed."
