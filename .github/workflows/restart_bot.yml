name: Restart Telegram Bot

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH → restart tgbot.service
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            opc@152.67.164.204 \
            "sudo systemctl restart tgbot.service && sleep 3 && sudo systemctl status tgbot.service --no-pager -l | tail -10"
          rm -f /tmp/vm_key
