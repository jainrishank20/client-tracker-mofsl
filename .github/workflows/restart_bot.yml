name: Restart Telegram Bot

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH → restart tgbot.service
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          printf '%s' "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          for attempt in 1 2 3 4 5; do
            echo "=== SSH attempt $attempt ==="
            if $SSH opc@${{ secrets.VM_HOST }} \
                "sudo systemctl restart tgbot.service && sleep 3 && sudo systemctl is-active tgbot.service && echo 'Bot restarted OK'"; then
              echo "Restart succeeded on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, waiting 30s..."
            sleep 30
          done
          rm -f /tmp/vm_key
