name: Deploy Bot to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy telegram_bot.py and restart bot
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"

          cat > /tmp/restart_bot.sh << 'SCRIPT'
          #!/bin/bash
          pkill -f telegram_bot.py || true
          sleep 2
          cd /home/opc/client-tracker-mofsl
          nohup python3 telegram_bot.py >> bot.log 2>&1 &
          disown
          echo "Bot restarted OK"
          SCRIPT

          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"

          # Oracle Cloud SSH can be intermittently blocked — retry up to 5 times
          for attempt in 1 2 3 4 5; do
            echo "=== SSH attempt $attempt ==="
            if $SCP telegram_bot.py /tmp/restart_bot.sh "$VM:$VMDIR/"; then
              echo "SCP succeeded"
              $SSH "$VM" "bash $VMDIR/restart_bot.sh" && echo "Bot deployed and restarted." && break
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done

          rm -f /tmp/vm_key
