name: Deploy Bot to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy bot files and ensure systemd service
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          VM="opc@${{ secrets.VM_HOST }}"
          VMDIR="/home/opc/app"

          # deploy script — refreshes files then restarts the live systemd service
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          VMDIR="/home/opc/app"
          SVC="tgbot"

          # Clean up leftover files from old deploys
          rm -f "$VMDIR/deploy.sh" "$VMDIR/client-tracker-bot.service" \
                "$VMDIR"/*.pyc "$VMDIR"/*.tmp
          find "$VMDIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          # Disable old service name if it exists
          sudo systemctl disable client-tracker-bot 2>/dev/null || true
          sudo rm -f /etc/systemd/system/client-tracker-bot.service
          sudo systemctl daemon-reload

          # Restart live service
          sudo systemctl restart ${SVC}
          sleep 3
          sudo systemctl is-active ${SVC} && echo "Bot running OK" || echo "WARNING: start failed"
          SCRIPT

          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"

          # Oracle Cloud SSH is intermittently blocked — retry up to 5 times
          for attempt in 1 2 3 4 5; do
            echo "=== SSH attempt $attempt ==="
            if $SCP telegram_bot.py symbol_map.py ticker_overrides.json \
                    /tmp/deploy.sh \
                    "$VM:$VMDIR/"; then
              echo "SCP succeeded"
              $SSH "$VM" "bash $VMDIR/deploy.sh" && echo "Deploy complete." && break
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done

          rm -f /tmp/vm_key
