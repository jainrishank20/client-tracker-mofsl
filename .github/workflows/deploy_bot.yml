name: Deploy Bot to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy bot files and ensure systemd service
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "$VM_SSH_KEY" > /tmp/vm_key
          chmod 600 /tmp/vm_key
          VM="opc@152.67.164.204"
          VMDIR="/home/opc/client-tracker-mofsl"

          # systemd unit — auto-restarts bot on crash or VM reboot
          cat > /tmp/client-tracker-bot.service << 'UNIT'
          [Unit]
          Description=Client Tracker MOFSL Telegram Bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=opc
          WorkingDirectory=/home/opc/client-tracker-mofsl
          ExecStart=/usr/bin/python3 /home/opc/client-tracker-mofsl/telegram_bot.py
          Restart=always
          RestartSec=15
          StandardOutput=append:/home/opc/client-tracker-mofsl/bot.log
          StandardError=append:/home/opc/client-tracker-mofsl/bot.log

          [Install]
          WantedBy=multi-user.target
          UNIT

          # deploy script — idempotent: sets up systemd if not present, then restarts
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          VMDIR="/home/opc/client-tracker-mofsl"
          SVC="client-tracker-bot"

          # Install/refresh systemd unit
          sudo cp /tmp/client-tracker-bot.service /etc/systemd/system/${SVC}.service
          sudo systemctl daemon-reload
          sudo systemctl enable ${SVC}

          # Restart via systemd (kills old process cleanly, starts fresh)
          sudo systemctl restart ${SVC}
          sleep 3
          sudo systemctl is-active ${SVC} && echo "Bot running via systemd OK" || echo "WARNING: systemd start failed"
          SCRIPT

          SCP="scp -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          SSH="ssh -i /tmp/vm_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"

          # Oracle Cloud SSH is intermittently blocked — retry up to 5 times
          for attempt in 1 2 3 4 5; do
            echo "=== SSH attempt $attempt ==="
            if $SCP telegram_bot.py symbol_map.py ticker_overrides.json \
                    /tmp/client-tracker-bot.service /tmp/deploy.sh \
                    "$VM:$VMDIR/"; then
              echo "SCP succeeded"
              $SSH "$VM" "bash $VMDIR/deploy.sh" && echo "Deploy complete." && break
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done

          rm -f /tmp/vm_key
